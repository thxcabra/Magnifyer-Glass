name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck · lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # The backend isn't reachable in CI; sitemap.ts degrades gracefully
          # to its static portion, so the build still succeeds.

  backend:
    name: Backend (ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # numpy 1.26 / pandas 2.2 ship wheels for 3.12.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q
        env:
          # Dummy values so app.main imports cleanly. The smoke tests only hit
          # /health, which never touches Supabase.
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_KEY: dummy-service-key
