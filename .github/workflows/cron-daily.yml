name: Daily NBA refresh

# Loads current-season NBA stats and reclassifies archetypes every night.
#
# CAVEAT: this job calls stats.nba.com via nba_api. The NBA Stats API
# frequently blocks cloud-datacenter IP ranges (incl. GitHub-hosted runners).
# If you see repeated timeouts/blocks, run this on a self-hosted runner, route
# through a residential proxy, or trigger it from a machine with a clean IP.
#
# Requires repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      season:
        description: "Season to refresh (e.g. 2024-25). Blank = current season."
        required: false
        default: ""

concurrency:
  group: cron-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Daily refresh (NBA stats + reclassify archetypes)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Passed via env (not string-interpolated into the script) to avoid
          # shell-injection from workflow_dispatch input.
          SEASON: ${{ github.event.inputs.season }}
        run: |
          if [ -n "$SEASON" ]; then
            python -m app.jobs.daily_refresh --season "$SEASON"
          else
            python -m app.jobs.daily_refresh
          fi
